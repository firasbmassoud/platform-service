spring.application.name=platform-service

# 8080 by default. SERVER_PORT lets the ECS task definition move the port
# without rebuilding the image.
server.port=${SERVER_PORT:8080}

# ECS sends SIGTERM before stopping a task during a rolling deployment. Without
# graceful shutdown the JVM exits immediately and any in-flight requests are
# dropped, which shows up as 5xx spikes on every deploy.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
